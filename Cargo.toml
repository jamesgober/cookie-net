# =============================================================================
#  R E P S   ·   cookie-net
# =============================================================================
[package]
name    = "cookie-net"
version = "0.4.0"

# Minimum Supported Rust Version (MSRV)
rust-version = "1.85"
edition = "2024"

# License
license = "Apache-2.0 OR MIT"

# Readme
readme = "README.md"

# Description
description = "HTTP cookies for Rust (RFC 6265bis): strict parsing of Cookie headers, Set-Cookie serialization with Secure, HttpOnly, SameSite, Max-Age and the __Host- and __Secure- prefixes, plus signed and encrypted cookies."

# Keywords (5 max)
keywords = ["cookie", "http", "session", "web", "security"]

# Categories
categories = ["web-programming"]

# Links
homepage      = "https://github.com/jamesgober/cookie-net"
repository    = "https://github.com/jamesgober/cookie-net"
documentation = "https://docs.rs/cookie-net"

# Authors
authors = ["James Gober <me@jamesgober.com>"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "cookie_net"
path = "src/lib.rs"


# FEATURE FLAGS
# #################################
[features]
# Declared at the 0.2.0 design lock, ahead of their code (docs/API.md,
# "Feature flags"; dev/PLAN.md D-016). Each gains its dependencies with the
# first code that needs them: parse-net at 0.3, crypt-io at 0.4.
default = ["std"]

# `*_now` functions that read the system clock. Implies `alloc`.
std = ["alloc"]

# `SetCookie::encode` and the `String`-returning `sign*` and `seal*` functions.
alloc = ["parse-net/alloc"]

# Signed cookies: `Key`, `KeyRing`, `Signer`. Keyed BLAKE3, HKDF, and wiping
# through crypt-io; works without `std` given an allocator (dev/PLAN.md D-033).
signed = ["dep:crypt-io", "crypt-io/mac-blake3", "crypt-io/kdf-hkdf", "crypt-io/zeroize"]

# Encrypted cookies: `Sealer`, `Plaintext`, `Opened`. XChaCha20-Poly1305
# through crypt-io, which needs the OS random source, so it implies `std`.
encrypted = ["signed", "std", "crypt-io/aead-chacha20", "crypt-io/std"]

# Client side: `parse_set_cookie`, `cookie_date` (0.5).
client = []

# The client cookie jar (0.5).
jar = ["client", "alloc"]


# DEPENDENCIES
# #################################
[dependencies]
# The shared HTTP grammar: byte classes, `find_byte`, `HttpDate`, and the
# `Sink` writers (dev/PLAN.md section 2). First party, zero dependencies,
# published; never a path dependency.
parse-net = { version = "0.6.1", default-features = false }
# Audited cryptography, the one recorded exception to the zero third-party
# dependency rule (dev/PLAN.md section 8). Only behind `signed` and
# `encrypted`, with crypt-io's defaults off.
crypt-io = { version = "1.1", default-features = false, optional = true }


# EXAMPLES (they use `SetCookie::encode`)
# #################################
[[example]]
name = "01_quick_start"
required-features = ["alloc"]

[[example]]
name = "02_sessions"
required-features = ["alloc"]

[[example]]
name = "03_signed_and_sealed"
required-features = ["encrypted"]


# DEV DEPENDENCIES
# #################################
[dev-dependencies]
# Property tests only; never a runtime dependency.
proptest = { version = "1", default-features = false, features = ["std"] }


# RELEASE PROFILE
# #################################
[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = "symbols"
