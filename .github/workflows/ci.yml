name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # Run every JS action on Node.js 24 ahead of GitHub's forced migration,
  # silencing "Node.js 20 actions are deprecated" runner warnings.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    name: Test (${{ matrix.os }} / ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, "1.85"]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (default features)
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy (all features)
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Clippy (no default features)
        run: cargo clippy --all-targets --no-default-features -- -D warnings
      - name: Test (default features)
        run: cargo test
      - name: Test (all features)
        run: cargo test --all-features
      - name: Test (no default features)
        run: cargo test --no-default-features
      - name: Test (signed without std)
        run: cargo test --no-default-features --features signed
      - name: Build examples
        run: cargo build --examples
      - name: Doc (all features)
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: "-D warnings"

  no-std:
    name: Bare metal (thumbv7em-none-eabi / ${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, "1.85"]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          targets: thumbv7em-none-eabi
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: thumbv7em
      # A target with no `std` at all proves the core never reaches for it
      # and needs no allocator (dev/PLAN.md, NFR-6). `alloc` builds there too.
      - name: Build (no features)
        run: cargo build --target thumbv7em-none-eabi --no-default-features
      - name: Build (alloc)
        run: cargo build --target thumbv7em-none-eabi --no-default-features --features alloc
      # `signed` builds without `std` (it needs an allocator at link time,
      # dev/PLAN.md D-033).
      - name: Build (signed)
        run: cargo build --target thumbv7em-none-eabi --no-default-features --features signed
      - name: Clippy (no features)
        run: cargo clippy --target thumbv7em-none-eabi --no-default-features -- -D warnings

  dependencies:
    name: First-party runtime dependencies only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # NFR-7: without the crypto features, parse-net is the whole tree.
      - name: Check the dependency tree
        run: |
          tree=$(cargo tree --edges normal --prefix none --features alloc,client,jar | sort -u)
          echo "$tree"
          extra=$(echo "$tree" | grep -v -E '^(cookie-net|parse-net) ' || true)
          if [ -n "$extra" ]; then echo "unexpected dependencies: $extra"; exit 1; fi

  fuzz-build:
    name: Fuzz targets build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Build every target
        working-directory: fuzz
        run: cargo fuzz build --target x86_64-unknown-linux-gnu

  security:
    name: Security (audit + deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit and cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny
      - name: Generate lockfile
        run: cargo generate-lockfile
      - name: Audit
        run: cargo audit
      - name: Deny
        run: cargo deny check
